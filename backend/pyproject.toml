[tool.poetry]
name = "context-store-backend"
version = "0.1.0"
description = "Aivaura Context Store MVP Backend"
authors = ["Aivaura"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
cryptography = "^43.0"
slowapi = "^0.1.9"
llama-index-core = ">=0.10.0"
llama-index-vector-stores-qdrant = ">=0.2.0"
llama-index-embeddings-ollama = ">=0.3.0"
qdrant-client = "^1.9.0"
sentence-transformers = {version = "^3.0", optional = true}
rank-bm25 = "^0.2.2"
groq = "^0.9.0"
anthropic = "^0.30.0"
openai = "^1.0.0"
ollama = "^0.3.0"
google-auth-oauthlib = "^1.2.0"
google-api-python-client = "^2.100.0"
httpx = {extras = ["http2"], version = "^0.27.0"}
openpyxl = "^3.1.0"
xlrd = "^2.0.1"
beautifulsoup4 = "^4.12.0"
python-docx = "^1.1.0"
pypdf = "^4.0.0"
mcp = "^1.0.0"
python-multipart = "^0.0.9"
aiofiles = "^23.0.0"
openai-whisper = {version = "*", optional = true}

[tool.poetry.extras]
whisper = ["openai-whisper"]
reranker = ["sentence-transformers"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
